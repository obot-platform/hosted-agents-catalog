name: Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install YAML parser
        run: python -m pip install PyYAML

      - name: Validate catalog YAML
        run: python .github/scripts/validate_catalog.py
