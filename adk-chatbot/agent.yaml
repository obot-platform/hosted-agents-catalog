# A browser-facing agent.
#
# port publishes the sandbox at /agent-connect/{instance id}; 8000 is what
# `adk web` listens on. No terminal: the interface is the chat UI, and a console
# would hand the user a shell they have no reason to hold.
name: ADK Chatbot
description: >-
  A conversational agent with a web UI, built on the Agent Development Kit.
  Give it MCP servers and chat with it in the browser.
harnessID: adk-chatbot/harness.yaml
# The agent itself. The harness is only a runtime: this is the code it serves,
# cloned into the sandbox at start-up, so one ADK harness can run any number of
# different agents.
gitRepo: https://github.com/obot-platform/obot-adk-chatbot.git
icon: data:image/svg+xml;base64,
iconDark: data:image/svg+xml;base64,
port: 8000
allowUserMCPServers: true
# Every model the installation has, rather than one pinned choice. Obot marks
# which is the default and which is the fast one, so the agent can pick sensibly
# without the template having to name a model that may not exist here.
models:
  - "*"
maxInstancesPerUser: 2
questions:
  - key: instruction
    name: Personality and purpose
    description: What this chatbot is for. Appended to its system prompt.
    type: string
    default: You are a helpful assistant.
