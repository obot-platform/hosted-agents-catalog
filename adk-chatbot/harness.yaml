# A Google Agent Development Kit runtime with an example chatbot baked in, so
# the sandbox boots with no network and the whole thing is signed and scanned
# as one artifact. The agent is at obot-platform/obot-adk-chatbot; a template
# can still set a gitRepo to run its own agent instead, which overrides the
# baked-in one.
#
# A long-running HTTP server rather than a shell application, so it is not
# interactive: it needs no TTY and would not benefit from one.
#
# No modelAPI: ADK reaches its model through LiteLLM and can use either an
# Anthropic- or an OpenAI-backed one.
name: ADK
description: >-
  Google's Agent Development Kit, serving an agent over HTTP.
image: ghcr.io/obot-platform/obot-adk-chatbot:0.1.0
interactive: false
icon: data:image/svg+xml;base64,
iconDark: data:image/svg+xml;base64,
